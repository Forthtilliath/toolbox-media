services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Origins allowed to call the API cross-origin — only matters for callers
      # hitting :8000 directly, since nginx (:8080) and Vite's dev proxy (:5173)
      # both make same-origin requests. Override for a non-default deployment.
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173
    volumes:
      # Matches the non-root "appuser" added in backend/Dockerfile — moving off
      # root means this now needs to be that user's home dir instead of /root.
      # NB: this is a new mount path, so the U2Net model will download again
      # once on first use after upgrading (the old /root/.u2net volume content
      # becomes unreachable, and can be removed with `docker volume prune`).
      - rembg-models:/home/appuser/.u2net
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rembg-models:
