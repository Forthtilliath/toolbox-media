# This file lands in /etc/nginx/conf.d/, included from inside the base
# image's http{} block — so http-level directives (like this zone) are valid
# here despite there being no explicit "http {" wrapper in this file.
# 10 req/s per IP with a burst of 20 tolerates a legitimate multi-file batch
# operation while still blocking a script hammering the API.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;
    # Browsers pile up cookies for "localhost" across every project served from it (cookies
    # aren't port-scoped), which can exceed nginx's 8k default and trip a 400 unrelated to
    # this app. Give it more headroom.
    large_client_header_buffers 4 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # script-src/connect-src stay strict (same-origin bundle, same-origin API
    # calls only). style-src needs 'unsafe-inline': some components set inline
    # style attributes with dynamic values (e.g. ContrastChecker's live color
    # preview), which can't be pre-hashed. img-src/media-src allow blob: and
    # data: for client-generated object URLs and data-URI previews.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
