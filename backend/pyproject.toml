[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "B008", # FastAPI's `Depends()`/`File()`/`Form()` defaults are the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
